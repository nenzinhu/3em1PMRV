<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Relatório PMRv | PMRv</title>

  <style>
    :root{
      --bg-0: #0b1220;
      --cardA: rgba(255,255,255,.10);
      --cardB: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --primary: #4f7cff;
      --primary2: #2f5eff;
      --danger: #ff4d4d;
      --shadow: 0 18px 45px rgba(0,0,0,.45);
      --shadowSoft: 0 10px 25px rgba(0,0,0,.30);
      --rXL: 18px;
      --rLG: 14px;
      --rMD: 12px;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --s1: 6px; --s2: 10px; --s3: 14px; --s4: 18px; --s5: 24px;
      --ease: cubic-bezier(.2,.9,.2,1);
      --dur: 180ms;
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 400px at 20% 0%, rgba(79,124,255,.28), transparent 55%),
        radial-gradient(700px 360px at 90% 20%, rgba(34,197,94,.20), transparent 55%),
        radial-gradient(800px 400px at 60% 100%, rgba(255,77,77,.14), transparent 60%),
        linear-gradient(180deg, #050814, var(--bg-0));
      padding: 14px;
    }
    .appShell{ max-width: 1050px; margin: 0 auto; }
    .topbar{
      position: sticky; top: 10px; z-index: 50;
      display:flex; align-items:center; justify-content:space-between; gap: var(--s3);
      padding: var(--s3); border-radius: var(--rXL);
      background: linear-gradient(180deg, var(--cardA), var(--cardB));
      border: 1px solid var(--border); box-shadow: var(--shadowSoft);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .brand{ display:flex; flex-direction:column; gap: 4px; min-width:0; }
    .brandRow{ display:flex; align-items:center; gap:10px; min-width:0; }
    .badge{
      display:inline-flex; align-items:center; padding: 6px 10px; border-radius: 999px;
      font-weight: 900; font-size: 12px;
      background: rgba(79,124,255,.14); border: 1px solid rgba(79,124,255,.35); white-space: nowrap;
    }
    .brand h1{ margin:0; font-size: 16px; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand small{ color: var(--muted); font-weight: 700; font-size: 12px; }
    .topActions{ display:flex; gap: 10px; flex-wrap: wrap; justify-content:flex-end; }
    .btn{
      border: 1px solid transparent; border-radius: 12px; padding: 10px 12px;
      font-weight: 900; font-size: 13px; cursor: pointer; color: var(--text);
      background: rgba(255,255,255,.08);
      transition: transform var(--dur) var(--ease), background var(--dur) var(--ease),
                  border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      user-select: none; -webkit-tap-highlight-color: transparent;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.14); }
    .btn:active{ transform: translateY(0px) scale(.99); }
    .btn:focus{ outline:none; box-shadow: 0 0 0 4px rgba(79,124,255,.28), 0 10px 22px rgba(0,0,0,.25); }
    .btnGhost{ background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); box-shadow: none; }
    .card{
      background: linear-gradient(180deg, var(--cardA), var(--cardB));
      border: 1px solid var(--border); border-radius: var(--rXL);
      padding: var(--s4); box-shadow: var(--shadow);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .embed{ overflow-x:auto; border-radius: var(--rXL); }
    @media (max-width: 520px){
      body{ padding: 10px; }
      .card{ padding: 14px; }
      .topbar{ padding: 12px; border-radius: 16px; flex-direction: column; align-items: stretch; }
      .topActions{ width: 100%; }
      .topActions .btn{ width: 100%; }
    }

    /* PMRv styles */
    .pmrv{ font-family:'Segoe UI', Arial, sans-serif; color:#111; }
    .pmrv .container{
      background:white;width:100%;max-width:750px;padding:15px;border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1); box-sizing:border-box; margin:0 auto;
    }
    .pmrv header{ text-align:center; margin-bottom:15px; border-bottom:3px solid #00A651; padding-bottom:8px; }
    .pmrv h1{ color:#1a472a; font-size:17px; margin:0; text-transform:uppercase; }
    .pmrv small{ font-size:11px; color:#666; font-weight:bold; }
    .pmrv .form-section{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:15px; }
    .pmrv .row-flex{ display:flex; gap:8px; grid-column:span 3; }
    @media (max-width:600px){
      .pmrv .form-section{ grid-template-columns:1fr; }
      .pmrv .row-flex{ flex-wrap:nowrap; grid-column:span 1; }
      .pmrv .span-3{ grid-column:span 1; }
      .pmrv button{ width:100%; }
    }
    .pmrv label{ display:block; font-weight:600; margin-bottom:4px; color:#444; font-size:12px; }
    .pmrv input,.pmrv select,.pmrv textarea{
      width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;
      font-size:14px; background-color:#fff;
    }
    .pmrv textarea{ resize:vertical; min-height:90px; font-family:inherit; }
    .pmrv #pmrv_relatorio{
      background:#f9f9f9; border:1px solid #ddd; padding:15px; border-radius:8px;
      white-space:pre-wrap; word-wrap:break-word; font-family:var(--mono);
      font-size:13px; line-height:1.4; color:#222; margin-top:10px; border-left:5px solid #00A651;
    }
    .pmrv .btn-group{ display:flex; gap:8px; margin-top:15px; flex-wrap:wrap; }
    .pmrv button{
      flex:1; padding:14px; border:none; border-radius:6px; cursor:pointer;
      font-weight:bold; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .pmrv .btn-copy{ background-color:#1a472a; color:white; }
    .pmrv .btn-whatsapp{ background-color:#25D366; color:white; }
    .pmrv .btn-clear{ background-color:#e0e0e0; color:#333; }
    .pmrv .hidden{ display:none !important; }
    .pmrv .manual-box{ background:#f0f4f1; padding:10px; border-radius:6px; border:1px solid #d1d8d4; margin-top:5px; }
    .pmrv .vitimas-box{ background:#fff0f0; padding:10px; border-radius:6px; border:1px solid #ffdada; display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
    .pmrv .radio-group{ display:flex; gap:10px; align-items:center; margin-bottom:5px; }
    .pmrv .radio-group label{ font-weight:normal; margin-bottom:0; cursor:pointer; display:flex; align-items:center; gap:3px; }
  </style>
</head>
<body>
  <div class="appShell">

    <header class="topbar">
      <div class="brand">
        <div class="brandRow">
          <span class="badge">PMRv • 3 em 1</span>
          <h1>Relatório PMRv</h1>
        </div>
        <small>Gerador Posto 19 – PMRv (copiar/WhatsApp)</small>
      </div>
      <div class="topActions">
        <a class="btn btnGhost" href="../index.html">← Menu</a>
      </div>
    </header>

    <div style="margin-top:12px;">
      <div class="card embed">
        <div class="pmrv">
          <div class="container">
            <header>
              <h1>COMANDO DE POLÍCIA MILITAR RODOVIÁRIA</h1>
              <small>1º BPMRv / 1ª CIA / Posto 19</small>
            </header>

            <div class="form-section">
              <div class="row-flex">
                <div style="flex-grow:1;">
                  <label>Protocolo SADE</label>
                  <input type="text" id="pmrv_sade" placeholder="Nº SADE" oninput="pmrv_atualizar()">
                </div>
                <div style="width:75px;">
                  <label>VTR</label>
                  <input type="text" id="pmrv_vtr" placeholder="0000" maxlength="4" oninput="pmrv_validarVtr(this)">
                </div>
                <div style="width:85px;">
                  <label>Rodovia</label>
                  <select id="pmrv_rodovia" onchange="pmrv_verificarRodovia()">
                    <option value="SC-401">401</option>
                    <option value="SC-405">405</option>
                    <option value="SC-406">406</option>
                    <option value="SC-281">281</option>
                    <option value="SC-407">407</option>
                  </select>
                </div>
              </div>

              <div class="row-flex">
                <div style="flex-grow:1;">
                  <label>Cidade</label>
                  <input type="text" id="pmrv_cidade" value="Florianópolis" oninput="pmrv_atualizar()">
                </div>
                <div style="width:100px;">
                  <label>KM</label>
                  <input type="text" id="pmrv_km" placeholder="0.000" maxlength="6" oninput="pmrv_atualizar()">
                </div>
              </div>

              <div class="span-3 manual-box">
                <label>Horário do Sinistro</label>
                <div class="radio-group">
                  <label><input type="radio" name="pmrv_tipo_hora" id="pmrv_hora_auto" checked onclick="pmrv_atualizar()"> Auto</label>
                  <label><input type="radio" name="pmrv_tipo_hora" id="pmrv_hora_manual" onclick="pmrv_atualizar()"> Manual</label>
                  <input type="time" id="pmrv_input_hora" oninput="pmrv_atualizar()" style="width:110px; padding:4px;">
                </div>
              </div>

              <div class="span-3">
                <label>Tipo de Ocorrência</label>
                <select id="pmrv_ocorrencia" onchange="pmrv_verificarVitimas()">
                  <option value="Sinistro de trânsito com danos materiais">Danos materiais</option>
                  <option value="Sinistro de trânsito com vítima(s)">Com vítima(s)</option>
                  <option value="Sinistro de trânsito com óbito">Com óbito</option>
                </select>
              </div>

              <div id="pmrv_box_vitimas" class="span-3 vitimas-box hidden">
                <div><label>Leve</label><input type="number" id="pmrv_qtd_leve" value="0" min="0" oninput="pmrv_atualizar()"></div>
                <div><label>Grave</label><input type="number" id="pmrv_qtd_grave" value="0" min="0" oninput="pmrv_atualizar()"></div>
                <div><label>Gravíss.</label><input type="number" id="pmrv_qtd_gravissima" value="0" min="0" oninput="pmrv_atualizar()"></div>
              </div>

              <div class="span-3">
                <label>Acionamento</label>
                <select id="pmrv_conhecimento" onchange="pmrv_atualizar()">
                  <option value="pela Central">Pela Central</option>
                  <option value="após deparar-se">Deparou-se</option>
                  <option value="por usuário da via">Usuário da via</option>
                </select>
              </div>

              <div class="span-3">
                <label>Sentido</label>
                <select id="pmrv_sentido" onchange="pmrv_toggleSentidoManual()">
                  <option value="Centro–Bairro">Centro–Bairro</option>
                  <option value="Bairro–Centro">Bairro–Centro</option>
                  <option value="KM Crescente">KM Crescente</option>
                  <option value="KM Decrescente">KM Decrescente</option>
                  <option value="MANUAL">Outro...</option>
                </select>
                <input type="text" id="pmrv_sentido_manual" class="hidden" placeholder="Descreva o sentido..." oninput="pmrv_atualizar()" style="margin-top:5px;">
              </div>

              <div class="span-3">
                <label>Tipo de Sinistro</label>
                <select id="pmrv_subtipo" onchange="pmrv_mudarSubtipo()">
                  <optgroup label="1. Atropelamento">
                    <option value="1.1">1.1 Atropelamento de Pedestre</option>
                    <option value="1.2">1.2 Atropelamento de Animal</option>
                  </optgroup>
                  <optgroup label="2. Abalroamento">
                    <option value="2.1">2.1 Abalroamento Longitudinal (Mesmo)</option>
                    <option value="2.2">2.2 Abalroamento Longitudinal (Oposto)</option>
                    <option value="2.3">2.3 Abalroamento Transversal</option>
                  </optgroup>
                  <optgroup label="3. Colisão">
                    <option value="3.1">3.1 Colisão Frontal</option>
                    <option value="3.2">3.2 Colisão Traseira</option>
                    <option value="3.3">3.3 Engavetamento</option>
                  </optgroup>
                  <optgroup label="4. Choque">
                    <option value="4.1">4.1 Choque em Poste</option>
                    <option value="4.6">4.6 Choque em Defensa</option>
                    <option value="4.9">4.9 Choque em Objeto (especificar)</option>
                  </optgroup>
                  <optgroup label="5. Saída de Pista">
                    <option value="5.1">5.1 Saída de Pista Simples</option>
                    <option value="5.3">5.3 Saída de Pista com Capotamento</option>
                    <option value="5.4">5.4 Saída de Pista com Tombamento</option>
                  </optgroup>
                  <optgroup label="6. Saída + Choque">
                    <option value="6.1">6.1 Saída + Choque Poste</option>
                    <option value="6.2">6.2 Saída + Choque Muro</option>
                    <option value="6.3">6.3 Saída + Choque Defensa</option>
                    <option value="6.4">6.4 Saída + Choque Objeto (especificar)</option>
                  </optgroup>
                  <optgroup label="7. Outros">
                    <option value="7.1">7.1 Outros (especificar)</option>
                  </optgroup>
                </select>

                <div id="pmrv_box_objeto" class="manual-box hidden">
                  <label>Qual o objeto?</label>
                  <input type="text" id="pmrv_nome_objeto" placeholder="Ex: árvore, barranco..." oninput="pmrv_mudarSubtipo()">
                </div>

                <div id="pmrv_box_outros" class="manual-box hidden">
                  <label>Descreva a natureza do sinistro:</label>
                  <input type="text" id="pmrv_descricao_outros" placeholder="Ex: Incêndio em veículo, queda de carga..." oninput="pmrv_mudarSubtipo()">
                </div>
              </div>

              <div class="span-3">
                <label>Dinâmica do Fato (Auto-editável)</label>
                <textarea id="pmrv_dinamica_texto" oninput="pmrv_atualizar()"></textarea>
              </div>
            </div>

            <div id="pmrv_relatorio"></div>

            <div class="btn-group">
              <button class="btn-clear" onclick="pmrv_limpar()">Limpar</button>
              <button class="btn-copy" onclick="pmrv_copiar()">📋 Copiar</button>
              <button class="btn-whatsapp" onclick="pmrv_enviarWhatsApp()">📱 WhatsApp</button>
            </div>
          </div>
        </div>

        <script>
          const pmrv_dinamicasPadrao = {
            "1.1":"O veículo V1 transitava pela via quando atropelou um pedestre.",
            "1.2":"O veículo V1 transitava pela via quando atropelou um animal.",
            "2.1":"Os veículos transitavam no mesmo sentido quando ocorreu abalroamento longitudinal.",
            "2.2":"Os veículos transitavam em sentidos opostos quando ocorreu abalroamento longitudinal.",
            "2.3":"O veículo V1 abalroou transversalmente o veículo V2.",
            "3.1":"Os veículos colidiram frontalmente.",
            "3.2":"O veículo V1 colidiu na traseira do veículo V2.",
            "3.3":"O veículo V1 colidiu com outros veículos, ocasionando engavetamento.",
            "4.1":"O veículo V1 chocou-se contra um poste.",
            "4.6":"O veículo V1 chocou-se contra uma defensa.",
            "4.9":"O veículo V1 chocou-se contra [OBJETO].",
            "5.1":"O veículo V1 perdeu o controle direcional e saiu da pista.",
            "5.3":"O veículo V1 perdeu o controle direcional, saiu da pista e capotou.",
            "5.4":"O veículo V1 perdeu o controle direcional, saiu da pista e tombou.",
            "6.1":"O veículo V1 saiu da pista e chocou-se contra um poste.",
            "6.2":"O veículo V1 saiu da pista e chocou-se contra um muro.",
            "6.3":"O veículo V1 saiu da pista e chocou-se contra uma defensa.",
            "6.4":"O veículo V1 saiu da pista e chocou-se contra [OBJETO].",
            "7.1":"Ocorrência registrada como [OUTROS]."
          };

          function pmrv_validarVtr(input){
            input.value = input.value.replace(/\D/g,'').substring(0,4);
            pmrv_atualizar();
          }

          function pmrv_verificarVitimas(){
            document.getElementById('pmrv_box_vitimas')
              .classList.toggle('hidden', document.getElementById('pmrv_ocorrencia').value !== "Sinistro de trânsito com vítima(s)");
            pmrv_atualizar();
          }

          function pmrv_verificarRodovia(){
            const rodovia = document.getElementById('pmrv_rodovia').value;
            const campoCidade = document.getElementById('pmrv_cidade');
            if (["SC-401","SC-405","SC-406"].includes(rodovia)){
              campoCidade.value = "Florianópolis";
              campoCidade.readOnly = true;
              campoCidade.style.backgroundColor = "#f0f0f0";
            } else {
              campoCidade.readOnly = false;
              campoCidade.style.backgroundColor = "#fff";
            }
            pmrv_atualizar();
          }

          function pmrv_formatarKM(val){
            if (!val) return "---";
            let clean = val.replace(/[^\d.,]/g,'').replace(',', '.');
            let num = parseFloat(clean);
            return isNaN(num) ? "---" : num.toLocaleString('pt-BR', { minimumFractionDigits: 3 });
          }

          function pmrv_toggleSentidoManual(){
            document.getElementById('pmrv_sentido_manual')
              .classList.toggle('hidden', document.getElementById('pmrv_sentido').value !== "MANUAL");
            pmrv_atualizar();
          }

          function pmrv_mudarSubtipo(){
            const cod = document.getElementById('pmrv_subtipo').value;
            const nomeObjeto = document.getElementById('pmrv_nome_objeto').value || "objeto fixo";
            const descOutros = document.getElementById('pmrv_descricao_outros').value || "natureza não especificada";

            document.getElementById('pmrv_box_objeto').classList.toggle('hidden', cod !== "4.9" && cod !== "6.4");
            document.getElementById('pmrv_box_outros').classList.toggle('hidden', cod !== "7.1");

            let texto = pmrv_dinamicasPadrao[cod] || "";
            if (cod === "4.9" || cod === "6.4") texto = texto.replace("[OBJETO]", nomeObjeto);
            else if (cod === "7.1") texto = texto.replace("[OUTROS]", descOutros);

            document.getElementById('pmrv_dinamica_texto').value = texto;
            pmrv_atualizar();
          }

          function pmrv_gerarTexto(comNegrito=false){
            const b = comNegrito ? "*" : "";
            const sade = document.getElementById('pmrv_sade').value || "---";
            const vtr = document.getElementById('pmrv_vtr').value || "---";
            const cidade = document.getElementById('pmrv_cidade').value || "---";
            const conhecimento = document.getElementById('pmrv_conhecimento').value;
            const ocorrencia = document.getElementById('pmrv_ocorrencia').value;
            const rodovia = document.getElementById('pmrv_rodovia').value;
            const km = pmrv_formatarKM(document.getElementById('pmrv_km').value);
            const dinamica = document.getElementById('pmrv_dinamica_texto').value;

            const sentido = document.getElementById('pmrv_sentido').value === "MANUAL"
              ? document.getElementById('pmrv_sentido_manual').value
              : document.getElementById('pmrv_sentido').value;

            const selectSubtipo = document.getElementById('pmrv_subtipo');
            let tipoLabel = selectSubtipo.options[selectSubtipo.selectedIndex].text.split(' ').slice(1).join(' ');
            if (selectSubtipo.value === "7.1" && document.getElementById('pmrv_descricao_outros').value){
              tipoLabel = document.getElementById('pmrv_descricao_outros').value;
            }

            let infoV = "";
            if (ocorrencia === "Sinistro de trânsito com vítima(s)"){
              const l = Number(document.getElementById('pmrv_qtd_leve').value || 0);
              const g = Number(document.getElementById('pmrv_qtd_grave').value || 0);
              const gs = Number(document.getElementById('pmrv_qtd_gravissima').value || 0);
              let p = [];
              if (l > 0) p.push(`${l.toString().padStart(2,'0')} leve(s)`);
              if (g > 0) p.push(`${g.toString().padStart(2,'0')} grave(s)`);
              if (gs > 0) p.push(`${gs.toString().padStart(2,'0')} gravíssima(s)`);
              infoV = p.length > 0 ? `\n${b}Vítimas:${b} ${p.join(', ')}` : `\n${b}Vítimas:${b} Qtd não informada`;
            }

            const hora = document.getElementById('pmrv_hora_manual').checked
              ? (document.getElementById('pmrv_input_hora').value || "---")
              : new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
            const data = new Date().toLocaleDateString('pt-BR');

            return (
              `${b}COMANDO DE POLÍCIA MILITAR RODOVIÁRIA${b}\n` +
              `${b}1º BPMRv / 1ª CIA / Posto 19${b}\n` +
              `${b}Protocolo SADE:${b} ${sade}\n` +
              `${b}Data:${b} ${data}\n` +
              `${b}Hora:${b} ${hora}\n` +
              `${b}Rodovia:${b} ${rodovia} / ${b}KM:${b} ${km}\n` +
              `${b}Cidade:${b} ${cidade}\n` +
              `${b}Tipo de ocorrência:${b} ${ocorrencia}\n` +
              `${b}Tipo de sinistro:${b} ${tipoLabel}${infoV}\n` +
              `A guarnição foi acionada ${conhecimento} para atendimento de sinistro na rodovia ${rodovia}, km ${km}, sentido ${sentido || '---'}, sendo empenhada a Viatura PM-${vtr}.\n` +
              `${dinamica}\n` +
              `Foram adotadas as providências administrativas cabíveis.`
            );
          }

          function pmrv_atualizar(){
            document.getElementById('pmrv_relatorio').innerText = pmrv_gerarTexto(false);
          }

          function pmrv_copiar(){
            navigator.clipboard.writeText(pmrv_gerarTexto(false)).then(() => {
              const btn = document.querySelector('.pmrv .btn-copy');
              btn.innerText = "✅ Copiado!";
              setTimeout(() => btn.innerText = "📋 Copiar", 2000);
            });
          }

          function pmrv_enviarWhatsApp(){
            window.open(`https://wa.me/?text=${encodeURIComponent(pmrv_gerarTexto(true))}`, '_blank');
          }

          function pmrv_limpar(){
            const ids = ["pmrv_sade","pmrv_vtr","pmrv_km","pmrv_sentido_manual","pmrv_nome_objeto","pmrv_descricao_outros","pmrv_dinamica_texto"];
            ids.forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });

            document.getElementById("pmrv_ocorrencia").value = "Sinistro de trânsito com danos materiais";
            document.getElementById("pmrv_conhecimento").value = "pela Central";
            document.getElementById("pmrv_sentido").value = "Centro–Bairro";
            document.getElementById("pmrv_subtipo").value = "1.1";
